name: FiftyThree
description: >-
  FiftyThree, Inc. was a New York City-based technology company that built tools
  for mobile creativity, best known for Paper (Apple's 2012 iPad App of the Year),
  the Pencil Bluetooth stylus, and Paste, a collaborative presentation tool. The
  company raised a Series A led by Andreessen Horowitz (a16z) in 2013 and, in July
  2014, shipped the FiftyThree SDK so third-party iOS apps such as Procreate and
  Noteshelf could integrate the Pencil stylus (pairing, palm rejection, surface
  pressure). FiftyThree's assets and patents were acquired by WeTransfer on August
  21, 2018, and the standalone products and developer surface were subsequently
  wound down. This profile is retained as a historical company record; there is no
  live public web API, developer portal, or OpenAPI to enrich.
